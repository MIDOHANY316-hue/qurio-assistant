<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qurio Assistant</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><header><b class="logo">Q</b><div><h1>Qurio Assistant</h1><p>مساعد كيريو الذكي</p></div></header><section id="login" class="panel"><h2>تسجيل دخول تجريبي</h2><p class="muted">استخدم بيانات تجريبية فقط، ولا تدخل كلمة مرور منصة كيريو.</p><label>كود الطالب<input id="studentCode" placeholder="كود تجريبي"></label><label>كلمة المرور<input id="studentPassword" type="password" placeholder="كلمة مرور تجريبية"></label><button id="loginBtn">دخول</button><p id="loginMsg"></p></section><section id="app" class="panel hidden"><div class="topline"><h2>حل تدريبات البرمجة</h2><button id="logoutBtn" class="secondary">خروج</button></div><p class="muted">اكتب السؤال أو ارفع صورة واضحة له.</p><label>السؤال<textarea id="question" rows="5" placeholder="اكتب السؤال هنا..."></textarea></label><label>صورة السؤال<input id="questionImage" type="file" accept="image/*"></label><img id="preview" class="preview hidden" alt="معاينة"><button id="solveBtn">حل السؤال بالذكاء الاصطناعي</button><p id="status"></p><section id="answer" class="answer hidden"><h3>الحل والشرح</h3><pre id="answerText"></pre></section></section><section id="admin" class="panel hidden"><h2>لوحة الأدمن التجريبية</h2><p>واجهة شكلية فقط وليست إدارة مستخدمين حقيقية.</p></section><footer>نسخة تجريبية</footer></main><script src="/script.js"></script></body></html>
